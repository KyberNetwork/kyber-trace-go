apiVersion: v1
kind: ConfigMap
metadata:
  name: obi-config
  namespace: observability
data:
  obi-config.yml: |
    discovery:
      instrument:
        # Only instrument pods that opt in with the label `kyber-trace/obi: "true"`.
        - k8s_namespace: '*'
          k8s_pod_labels:
            kyber-trace/obi: 'true'
      exclude_instrument:
        - k8s_namespace: kube-system
        - k8s_namespace: observability
    attributes:
      kubernetes:
        enable: true
    ebpf:
      # propagate W3C traceparent through HTTP headers so OBI spans and app spans share one trace
      context_propagation: headers
    otel_traces_export:
      # same agent (opentelemetry-collector-agent DaemonSet) used by kyber-trace-go SDK mode
      endpoint: http://opentelemetry-collector-agent.observability.svc:4318
      sampler:
        name: parentbased_traceidratio
        arg: '0.5'
    otel_metrics_export:
      endpoint: http://opentelemetry-collector-agent.observability.svc:4318
